name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_ARGS: -Pgroceries.versionCode=${{ github.run_number }}
      # Bio Company app cipher; without it the card-points call is unavailable in the build.
      BIOCOMPANY_AES_KEY: ${{ secrets.BIOCOMPANY_AES_KEY }}
      BIOCOMPANY_AES_IV: ${{ secrets.BIOCOMPANY_AES_IV }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK with accepted licences; AGP downloads missing platforms itself.
      - uses: gradle/actions/setup-gradle@v6

      - name: Version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_ARGS=$VERSION_ARGS -Pgroceries.versionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Optional release signing. Repository secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .jks),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the release APK stays unsigned; the debug APK is installable."
          fi

      - name: Unit tests
        run: ./gradlew --no-configuration-cache testDebugUnitTest $VERSION_ARGS

      - name: Lint
        continue-on-error: true # no baseline yet; report only
        run: ./gradlew --no-configuration-cache lintDebug $VERSION_ARGS

      - name: Build
        run: |
          tasks=":app:assembleDebug :app:assembleRelease"
          if [ "$SIGNED" = "true" ]; then tasks="$tasks :app:bundleRelease"; fi
          ./gradlew --no-configuration-cache --stacktrace $tasks $VERSION_ARGS

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/digital-fridge-${{ github.run_number }}-debug.apk
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in *unsigned*) cp "$f" dist/digital-fridge-${{ github.run_number }}-release-unsigned.apk ;;
                         *) cp "$f" dist/digital-fridge-${{ github.run_number }}-release.apk ;; esac
          done
          cp app/build/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: digital-fridge-apk-${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: digital-fridge-apk-${{ github.run_number }}
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
