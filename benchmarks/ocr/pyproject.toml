[project]
name = "groceries-ocr-benchmark"
version = "0.1.0"
description = "Local Tesseract versus GLM-OCR receipt benchmark"
requires-python = ">=3.10"
dependencies = [
    "mlx-vlm>=0.3.10,<1",
]

[project.optional-dependencies]
pytorch = [
    "accelerate>=1.10,<2",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "transformers>=5.3,<6",
]

[tool.uv]
package = false
